name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend-tests:
    name: Backend & ML unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack_recsys/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match fullstack_recsys/api/Dockerfile (python:3.9-slim) and backend/runtime.txt
          python-version: '3.9'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend pytest
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key
        run: pytest -q tests

      - name: Install ML API dependencies
        working-directory: fullstack_recsys/api
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run ML API pytest
        working-directory: fullstack_recsys/api
        run: pytest -q tests

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fullstack_recsys/react-front

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Run frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false
